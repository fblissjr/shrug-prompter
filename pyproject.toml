[project]
name = "shrug-prompter"
version = "0.6.0"
description = "ComfyUI custom nodes for heylookitsanllm — single-user MLX VLM/LLM inference server"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
# Runtime deps. `aiohttp` is intentionally NOT declared — it's a ComfyUI
# built-in, and declaring it would shadow ComfyUI's pinned version.
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    "orjson>=3.9",
    "pillow>=10.0",
    "torch>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
