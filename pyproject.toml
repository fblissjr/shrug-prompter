#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["# Requirements for shrug-prompter ComfyUI custom node", "# Most of these are typically already available in ComfyUI environments", "torch", "pillow", "aiohttp", "requests"]

[project.urls]
Repository = "https://github.com/fblissjr/shrug-prompter"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/fblissjr/shrug-prompter/wiki"
"Bug Tracker" = "https://github.com/fblissjr/shrug-prompter/issues"

